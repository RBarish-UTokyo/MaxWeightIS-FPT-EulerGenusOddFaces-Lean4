status:
  scope: >-
    Proved: MWIS.Spec.fpt_claim, the uniform bit-operation statement of the
    fixed-parameter theorem for integer weights, for one fixed program
    (MWIS.FPTProgram.fptProgram instantiated with the two constant Fun
    programs, 402 procedures) and one explicit absolute constant. The statement
    is in Challenge.lean, a verbatim copy of MWIS/Statement.lean and
    MWIS/FPTStatement.lean without the unused inherited MainClaim. The surface
    is represented combinatorially (flag maps); no realization theorem
    relating flag maps to topological surfaces is formalized. The input is a
    fixed binary encoding with common word widths. The rational-weight
    extension is not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

