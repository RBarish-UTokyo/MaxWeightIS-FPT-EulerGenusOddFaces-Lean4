fidelity:
  divergences: >-
    (1) Surfaces are finite combinatorial flag maps, and the drawing is given
    together with a witness that it is a subdrawing of a cellular map of the
    surface; the ambient map is a proof witness only, the program reads only
    the drawing, and the bound holds for every such map. (2) N = |V| + |E| + 1
    counts the drawing, which is at most the encoding length. (3) The machine
    is an explicit sixteen-register pointer machine with a logarithmic
    bit-cost measure including the explicit stack cost of calls; the input is
    a fixed binary encoding with common widths. (4) The weights are integers,
    encoded as rationals with denominator one. (5) The integral quotient
    coordinates are computed from a spanning tree and unit-pivot elimination,
    not by normal forms; preprocessing is one maximum flow; recovery uses
    perturbed edge costs.

review:
  status: agent-reviewed
  notes: >-
    The Challenge statement was audited for fidelity by an independent agent
    review. The proof is checked by the Lean kernel, and Comparator verifies
    that the solution proves the challenge statement using only the permitted
    axioms. No human mathematical review or Palomar editorial review is
    asserted.

alignment:
  namespace: "MWIS"
  statements:
    - source: "The fixed-parameter theorem (with its noncellular and disconnected extensions)"
      lean: "MWIS.Spec.fpt_claim"
      module: "Solution"
      status: proved
      note: >-
        Statement MWIS.Spec.FPTClaim (MWIS/FPTStatement.lean); proof
        MWIS.FPTFinal.fptClaim_of_optimizer applied to the exact LP optimizer
        MWIS.FunLP.optF.
    - source: "Correctness of the hard-component solver (integral coordinates, network LP, recovery)"
      lean: "MWIS.FPTHardConcrete.fptHard_correct"
      module: "MWIS.FPTHardConcrete"
      status: proved
      note: "The hard function returns a maximum-weight independent set on every connected nonbipartite all-half component."
    - source: "Integral quotient coordinates and the rank bound"
      lean: "MWIS.TreeCotree.faceCoordinates_valid"
      module: "MWIS.TreeCotreeFPT"
      status: proved
      note: "Explicit coordinates of ker B / A Z^V isomorphic to Z^r x Z/2; faceCoordinates_rank_le bounds r by the computed row count d <= gamma + k."

