# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "An FPT Algorithm for Maximum-Weight Independent Set in Embedded Graphs, in Lean 4"
  description: >-
    A Lean 4 and Mathlib formalization of a fixed-parameter theorem of
    "Maximum-weight independent set in embedded graphs parameterized by Euler
    genus and number of odd faces" (forthcoming), with a provably correct
    implementation of the algorithm as one fixed program for an explicit
    sixteen-register pointer machine. Lean proves that for every graph drawn
    in a closed surface of Euler genus gamma whose complement has k regions of
    odd total boundary length, and all integer vertex weights, the program
    outputs a maximum-weight independent set within
    2^(c (p size(p) + 1)) (N size(M))^c bit operations, where p = gamma + k,
    N = |V| + |E| + 1, M = max(1, max |w_v|), size(x) is the binary length of
    x and c is an absolute constant; that is, 2^O(p log(p+1)) poly(N, log(M+1))
    with an absolute polynomial exponent. Surfaces are represented by finite
    combinatorial flag maps; orientable and nonorientable surfaces,
    disconnected and noncellular drawings, loops, multiple edges, isolated
    vertices and negative weights are covered. The algorithm solves one exact
    linear program per retained component over a finite-group network whose
    size depends only on p, using exact integral quotient coordinates, midpoint
    convexity of class minima and a coarse Jensen inequality, and recovers an
    optimal set from perturbed edge costs. The cost is a logarithmic bit-cost
    measure including an explicit stack simulation of recursive calls. The
    proofs use exactly propext, Classical.choice and Quot.sound.
  authors:
    - "Robert D. Barish"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Robert D. Barish"

